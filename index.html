<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>出勤画像メーカー</title>
  <style>
    :root { color-scheme: light; --ink: #4d3850; --pink: #ef8fb1; --pink-soft: #fff1f6; --line: #f6bfd0; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; color: var(--ink); background: linear-gradient(135deg, #fff7fa, #f8f4ff); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; }
    .app { width: min(1220px, 100%); margin: 0 auto; padding: 32px 20px 48px; }
    header { margin-bottom: 24px; }
    h1 { margin: 0; font-size: clamp(1.7rem, 4vw, 2.35rem); letter-spacing: .06em; }
    header p { margin: 8px 0 0; color: #806b7b; }
    .layout { display: grid; grid-template-columns: minmax(290px, 390px) minmax(0, 1fr); align-items: start; gap: 28px; }
    .controls, .preview-card { background: rgba(255, 255, 255, .86); border: 1px solid rgba(239, 143, 177, .22); border-radius: 24px; box-shadow: 0 12px 32px rgba(110, 70, 95, .10); }
    .controls { padding: 22px; }
    h2 { margin: 0 0 15px; font-size: 1.1rem; }
    .field-label { display: block; font-size: .88rem; font-weight: 700; margin-bottom: 7px; }
    .upload { display: grid; gap: 8px; margin-bottom: 22px; }
    input, select, button { font: inherit; }
    input[type="file"], input[type="time"], select { width: 100%; min-width: 0; max-width: 100%; min-height: 42px; border: 1px solid #e9cdd7; border-radius: 10px; padding: 8px 10px; background: #fff; color: var(--ink); }
    .hint { margin: 0; color: #876f7c; font-size: .78rem; line-height: 1.55; }
    .border-toggle { display: flex; align-items: center; gap: 9px; margin: 0 0 18px; font-size: .92rem; }
    .border-toggle input { width: 18px; height: 18px; accent-color: var(--pink); }
    .schedule-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 15px; }
    .schedule-heading h2 { margin: 0; }
    .schedule-fields { display: grid; gap: 12px; }
    .day-field { padding: 16px; background: var(--pink-soft); border-radius: 14px; }
    .day-name { display: block; margin: 0 0 11px; font-size: 1.12rem; font-weight: 800; }
    .slot-list { display: grid; gap: 10px; }
    .slot-card { width: 100%; min-width: 0; padding: 12px; border: 1px solid rgba(239, 143, 177, .35); border-radius: 12px; background: rgba(255, 255, 255, .56); }
    .slot-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: .84rem; font-weight: 800; }
    .state-field { display: grid; gap: 5px; font-size: .78rem; font-weight: 700; }
    .time-fields { display: grid; width: 100%; min-width: 0; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: end; gap: 9px; margin-top: 10px; }
    .time-fields label { display: grid; width: 100%; min-width: 0; max-width: 100%; gap: 5px; font-size: .78rem; font-weight: 700; }
    .time-fields input[type="time"] { display: block; inline-size: 100% !important; min-inline-size: 0 !important; max-inline-size: 100% !important; }
    .time-fields.is-hidden { display: none; }
    .preview-card { padding: 18px; }
    .preview-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 0 0 13px; }
    .preview-heading h2 { margin: 0; }
    .canvas-wrap { overflow: hidden; border-radius: 15px; background: #eee; box-shadow: 0 5px 16px rgba(50, 32, 44, .12); }
    canvas { display: block; width: 100%; height: auto; aspect-ratio: 1; }
    .save-row { margin-top: 16px; }
    button { font: inherit; }
    .save-row button { width: 100%; min-height: 50px; border: 0; border-radius: 999px; cursor: pointer; background: linear-gradient(135deg, #ef86ac, #d874a1); color: white; font-weight: 800; box-shadow: 0 7px 14px rgba(202, 87, 137, .25); }
    .save-row button:hover:not(:disabled) { filter: brightness(1.03); }
    .save-row button:disabled { cursor: not-allowed; opacity: .55; box-shadow: none; }
    .add-slot-button, .remove-slot-button { min-height: 34px; border: 1px solid #e9a8bf; border-radius: 9px; cursor: pointer; font-size: .82rem; font-weight: 700; }
    .add-slot-button { width: 100%; margin-top: 10px; color: #b64f78; background: #fff; }
    .remove-slot-button { padding: 4px 9px; color: #9c5e72; background: transparent; }
    .reset-button { flex: 0 0 auto; min-height: 34px; border: 1px solid #d9a7b8; border-radius: 9px; cursor: pointer; color: #8d5267; background: #fff; font-size: .78rem; font-weight: 700; padding: 5px 9px; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(239, 143, 177, .42); outline-offset: 2px; }
    @media (max-width: 760px) { .app { padding: 22px 14px 36px; } .layout { grid-template-columns: 1fr; gap: 20px; } .preview-card { order: 2; } .controls { order: 1; } }
    @media (max-width: 480px) {
      .time-fields { grid-template-columns: 1fr; gap: 10px; }
      .time-fields label { padding-right: 24px; }
      .time-fields input[type="time"] { -webkit-appearance: none; appearance: none; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>出勤画像メーカー</h1>
      <p>背景を選んで、空・満と時間を入力するだけ。SNS用の出勤案内を作れます。</p>
    </header>
    <div class="layout">
      <section class="controls" aria-label="出勤情報の入力">
        <div class="upload">
          <label class="field-label" for="backgroundInput">背景画像</label>
          <input id="backgroundInput" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif">
          <p class="hint">画像はこの端末のブラウザ内だけで使います。小さい画像はタイル状に繰り返します。</p>
          <p id="backgroundMessage" class="hint" role="status" aria-live="polite"></p>
          <label class="field-label" for="backgroundMode">背景の表示</label>
          <select id="backgroundMode">
            <option value="tile">繰り返し（元画像サイズ）</option>
            <option value="cover">全面表示（隙間なし）</option>
            <option value="center">中央配置</option>
          </select>
          <label class="field-label" for="slotLayoutMode">複数枠の表示</label>
          <select id="slotLayoutMode">
            <option value="separate">枠ごとに行を分ける</option>
            <option value="compact">曜日ごとに1行へまとめる</option>
          </select>
          <label class="field-label" for="outputSize">画像サイズ</label>
          <select id="outputSize">
            <option value="800">CH向け(800×800)</option>
            <option value="1080">SNS向け(1080×1080)</option>
          </select>
        </div>
        <label class="border-toggle"><input id="borderToggle" type="checkbox" checked> パネルにピンクの枠線を付ける</label>
        <div class="schedule-heading">
          <h2>平日の出勤予定</h2>
          <button id="resetScheduleButton" class="reset-button" type="button">初期値へ戻す</button>
        </div>
        <div id="scheduleFields" class="schedule-fields"></div>
      </section>
      <section class="preview-card" aria-label="完成イメージ">
        <div class="preview-heading"><h2>プレビュー</h2><span id="previewSizeLabel" class="hint">800×800px</span></div>
        <div class="canvas-wrap"><canvas id="preview" width="1080" height="1080" aria-label="出勤案内画像のプレビュー"></canvas></div>
        <div class="save-row"><button id="saveButton" type="button">PNG保存</button></div>
      </section>
    </div>
  </main>
  <script>
    (() => {
      'use strict';
      const STORAGE_KEY = 'attendance-image-maker-v4';
      const DEFAULT_BACKGROUND_MODE = 'cover';
      const MAX_SLOTS_PER_DAY = 5;
      const DAYS = [
        { label: '月曜日', status: '空', slots: [{ start: '09:00', end: '18:00' }] },
        { label: '火曜日', status: '空', slots: [{ start: '09:00', end: '18:00' }] },
        { label: '水曜日', status: '空', slots: [{ start: '09:00', end: '18:00' }] },
        { label: '木曜日', status: '空', slots: [{ start: '09:00', end: '18:00' }] },
        { label: '金曜日', status: '空', slots: [{ start: '09:00', end: '18:00' }] }
      ];
      const canvas = document.querySelector('#preview');
      const ctx = canvas.getContext('2d');
      const fields = document.querySelector('#scheduleFields');
      const backgroundInput = document.querySelector('#backgroundInput');
      const backgroundMessage = document.querySelector('#backgroundMessage');
      const backgroundModeInput = document.querySelector('#backgroundMode');
      const slotLayoutModeInput = document.querySelector('#slotLayoutMode');
      const outputSizeInput = document.querySelector('#outputSize');
      const previewSizeLabel = document.querySelector('#previewSizeLabel');
      const borderToggle = document.querySelector('#borderToggle');
      const saveButton = document.querySelector('#saveButton');
      const resetScheduleButton = document.querySelector('#resetScheduleButton');
      let backgroundImage = null;
      let state = loadState();
      let drawQueued = false;
      let backgroundLoadVersion = 0;

      function loadState() {
        try {
          const currentSaved = localStorage.getItem(STORAGE_KEY);
          const saved = JSON.parse(currentSaved || localStorage.getItem('attendance-image-maker-v3') || localStorage.getItem('attendance-image-maker-v2') || localStorage.getItem('attendance-image-maker-v1'));
          if (saved && Array.isArray(saved.days) && saved.days.length === DAYS.length) {
            return {
              days: saved.days.map((day, index) => normalizeDay(day, DAYS[index])),
              showBorder: saved.showBorder !== false,
              backgroundMode: currentSaved && ['tile', 'cover', 'center'].includes(saved.backgroundMode) ? saved.backgroundMode : DEFAULT_BACKGROUND_MODE,
              slotLayoutMode: saved.slotLayoutMode === 'compact' ? 'compact' : 'separate',
              outputSize: saved.outputSize === 1080 ? 1080 : 800
            };
          }
        } catch (_) { /* 保存内容が壊れている場合は初期値を使う */ }
        return { days: createDefaultDays(), showBorder: true, backgroundMode: DEFAULT_BACKGROUND_MODE, slotLayoutMode: 'separate', outputSize: 800 };
      }
      function isTime(value) { return typeof value === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(value); }
      function normalizeSlot(slot) {
        return {
          start: isTime(slot && slot.start) ? slot.start : '09:00',
          end: isTime(slot && slot.end) ? slot.end : '18:00'
        };
      }
      function normalizeDay(day, fallback) {
        const legacySlots = Array.isArray(day && day.slots) ? day.slots : (day && (day.start || day.end) ? [day] : []);
        const status = day && (day.status === '満' || day.state === '満') ? '満'
          : legacySlots.length && legacySlots.every(slot => slot && slot.state === '満') ? '満' : '空';
        const availableSlots = legacySlots.filter(slot => !slot || slot.state !== '満').slice(0, MAX_SLOTS_PER_DAY).map(slot => normalizeSlot(slot));
        return { label: fallback.label, status, slots: status === '満' ? [] : (availableSlots.length ? availableSlots : fallback.slots.map(slot => ({ ...slot }))) };
      }
      function saveState() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ days: state.days, showBorder: state.showBorder, backgroundMode: state.backgroundMode, slotLayoutMode: state.slotLayoutMode, outputSize: state.outputSize })); }
        catch (_) { /* 保存できなくてもプレビューとPNG生成は継続する */ }
      }
      function createDefaultDays() { return DAYS.map(day => ({ label: day.label, status: day.status, slots: day.slots.map(slot => ({ ...slot })) })); }
      function makeFields() {
        fields.replaceChildren(...state.days.map((day, index) => {
          const row = document.createElement('div');
          row.className = 'day-field';
          const title = document.createElement('h3');
          title.className = 'day-name';
          title.textContent = day.label;
          row.append(title);
          row.append(makeDayStatusField(index, day.status));
          if (day.status === '満') {
            const fullMessage = document.createElement('p');
            fullMessage.className = 'hint';
            fullMessage.textContent = 'この曜日は満枠です。時間帯は入力しません。';
            row.append(fullMessage);
            return row;
          }
          const slotList = document.createElement('div');
          slotList.className = 'slot-list';
          day.slots.forEach((slot, slotIndex) => slotList.append(makeSlotField(index, slotIndex, slot)));
          row.append(slotList);
          if (day.slots.length < MAX_SLOTS_PER_DAY) {
            const addButton = document.createElement('button');
            addButton.className = 'add-slot-button';
            addButton.type = 'button';
            addButton.dataset.action = 'add-slot';
            addButton.dataset.dayIndex = String(index);
            addButton.textContent = '＋ 時間帯を追加';
            row.append(addButton);
          }
          return row;
        }));
      }
      function makeDayStatusField(dayIndex, status) {
        const label = document.createElement('label');
        label.className = 'state-field';
        label.append('状態');
        const select = document.createElement('select');
        select.dataset.dayIndex = String(dayIndex);
        select.dataset.field = 'status';
        select.add(new Option('空', '空'));
        select.add(new Option('満', '満'));
        select.value = status;
        label.append(select);
        return label;
      }
      function makeSlotField(dayIndex, slotIndex, slot) {
        const card = document.createElement('section');
        card.className = 'slot-card';
        const header = document.createElement('div');
        header.className = 'slot-header';
        const slotTitle = document.createElement('span');
        slotTitle.textContent = '出勤枠 ' + (slotIndex + 1);
        header.append(slotTitle);
        if (slotIndex > 0) {
          const removeButton = document.createElement('button');
          removeButton.className = 'remove-slot-button';
          removeButton.type = 'button';
          removeButton.dataset.action = 'remove-slot';
          removeButton.dataset.dayIndex = String(dayIndex);
          removeButton.dataset.slotIndex = String(slotIndex);
          removeButton.textContent = '削除';
          header.append(removeButton);
        }
        card.append(header);
        const timeFields = document.createElement('div');
        timeFields.className = 'time-fields';
        timeFields.append(makeTimeField('開始時間', dayIndex, slotIndex, 'start', slot.start));
        timeFields.append(makeTimeField('終了時間', dayIndex, slotIndex, 'end', slot.end));
        card.append(timeFields);
        return card;
      }
      function makeTimeField(labelText, dayIndex, slotIndex, field, value) {
        const label = document.createElement('label');
        label.append(labelText);
        const input = document.createElement('input');
        input.type = 'time';
        input.value = value;
        input.dataset.dayIndex = String(dayIndex);
        input.dataset.slotIndex = String(slotIndex);
        input.dataset.field = field;
        label.append(input);
        return label;
      }
      function formatTime(value) {
        if (!isTime(value)) return '';
        const [hourText, minuteText] = value.split(':');
        const hour = Number(hourText);
        const minute = Number(minuteText);
        if (!Number.isFinite(hour) || !Number.isFinite(minute)) return '';
        return minute === 0 ? `${hour}時` : `${hour}時${minute}分`;
      }
      function drawFallbackBackground() {
        ctx.fillStyle = '#f9e7ed'; ctx.fillRect(0, 0, 1080, 1080);
        ctx.fillStyle = '#f5d5e1';
        for (let y = -40; y < 1080; y += 120) for (let x = -40; x < 1080; x += 120) { ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill(); }
      }
      function drawTiledBackground() {
        if (!backgroundImage) return drawFallbackBackground();
        const width = backgroundImage.naturalWidth;
        const height = backgroundImage.naturalHeight;
        if (state.backgroundMode === 'tile') {
          const pattern = ctx.createPattern(backgroundImage, 'repeat');
          if (pattern) { ctx.fillStyle = pattern; ctx.fillRect(0, 0, 1080, 1080); }
          return;
        }
        if (state.backgroundMode === 'cover') {
          const scale = Math.max(1080 / width, 1080 / height);
          const drawWidth = width * scale;
          const drawHeight = height * scale;
          ctx.drawImage(backgroundImage, (1080 - drawWidth) / 2, (1080 - drawHeight) / 2, drawWidth, drawHeight);
          return;
        }
        ctx.drawImage(backgroundImage, (1080 - width) / 2, (1080 - height) / 2);
      }
      function roundedRect(x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + width, y, x + width, y + height, r);
        ctx.arcTo(x + width, y + height, x, y + height, r);
        ctx.arcTo(x, y + height, x, y, r);
        ctx.arcTo(x, y, x + width, y, r);
        ctx.closePath();
      }
      function drawPreview() {
        ctx.clearRect(0, 0, 1080, 1080);
        drawTiledBackground();
        const displayRows = [];
        state.days.forEach((day, dayIndex) => {
          if (day.status === '満') displayRows.push({ day, dayIndex, full: true, firstOfDay: true });
          else if (state.slotLayoutMode === 'compact') {
            day.slots.forEach((slot, slotIndex) => displayRows.push({ day, dayIndex, slot, firstOfDay: slotIndex === 0, showDay: slotIndex === 0 }));
          }
          else day.slots.forEach((slot, slotIndex) => displayRows.push({ day, dayIndex, slot, firstOfDay: slotIndex === 0, showDay: true }));
        });
        const rowHeight = Math.min(120, Math.max(30, Math.floor(760 / displayRows.length)));
        const contentHeight = rowHeight * displayRows.length;
        const panelHeight = Math.min(960, contentHeight + 120);
        const panel = { x: 76, y: (1080 - panelHeight) / 2, width: 928, height: panelHeight, radius: 48 };
        roundedRect(panel.x, panel.y, panel.width, panel.height, panel.radius);
        ctx.fillStyle = 'rgba(255, 255, 255, .82)'; ctx.fill();
        if (state.showBorder) { ctx.strokeStyle = 'rgba(239, 143, 177, .72)'; ctx.lineWidth = 4; ctx.stroke(); }
        ctx.textBaseline = 'middle';
        const dayFontSize = Math.min(42, Math.max(16, Math.round(rowHeight * .36)));
        const timeFontSize = Math.min(45, Math.max(16, Math.round(rowHeight * .40)));
        let y = panel.y + 60 + rowHeight / 2;
        displayRows.forEach((row, rowIndex) => {
          if (row.dayIndex > 0 && row.firstOfDay) { ctx.save(); ctx.setLineDash([4, 12]); ctx.strokeStyle = 'rgba(221, 152, 178, .52)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(150, y - rowHeight / 2); ctx.lineTo(930, y - rowHeight / 2); ctx.stroke(); ctx.restore(); }
          if (row.showDay || row.full) { ctx.fillStyle = '#6f5264'; ctx.font = '700 ' + dayFontSize + 'px -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif'; ctx.fillText(row.day.label, 150, y); }
          if (row.full) drawFullStatus(y, dayFontSize);
          else drawSlot(row.slot, y, dayFontSize, timeFontSize);
          y += rowHeight;
        });
      }
      function drawSlot(slot, y, statusFontSize, timeFontSize) {
        drawStatusText('空', y, statusFontSize);
        const start = formatTime(slot.start), end = formatTime(slot.end);
        if (start && end) { ctx.fillStyle = '#42303d'; ctx.font = '700 ' + timeFontSize + 'px -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif'; ctx.fillText(start + '～' + end, 420, y); }
        else { ctx.fillStyle = '#a16f82'; ctx.font = '600 ' + Math.max(14, timeFontSize - 8) + 'px -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif'; ctx.fillText('開始・終了時間を入力してください', 420, y); }
      }
      function drawFullStatus(y, statusFontSize) {
        drawStatusText('満', y, statusFontSize);
      }
      function drawStatusText(status, y, statusFontSize) {
        ctx.save();
        ctx.font = '700 ' + statusFontSize + 'px -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif';
        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = status === '満' ? '#e45043' : '#2183cf';
        ctx.fillText(status, 330, y);
        ctx.restore();
      }
      function requestDraw() {
        if (drawQueued) return;
        drawQueued = true;
        requestAnimationFrame(() => { drawQueued = false; drawPreview(); });
      }
      function hasIncompleteTime() { return state.days.some(day => day.status === '空' && day.slots.some(slot => !isTime(slot.start) || !isTime(slot.end))); }
      function updateSaveState() {
        const incomplete = hasIncompleteTime();
        saveButton.disabled = incomplete;
        saveButton.textContent = incomplete ? '開始・終了時間を入力してください' : 'PNG保存';
      }
      function updateOutputSizeLabel() { previewSizeLabel.textContent = state.outputSize + '×' + state.outputSize + 'px'; }
      function updateDay(event) {
        const target = event.target;
        const dayIndex = Number(target.dataset.dayIndex);
        const slotIndex = Number(target.dataset.slotIndex);
        const field = target.dataset.field;
        if (!Number.isInteger(dayIndex) || !field) return;
        if (field === 'status') {
          state.days[dayIndex].status = target.value;
          if (target.value === '空' && state.days[dayIndex].slots.length === 0) state.days[dayIndex].slots.push({ start: '09:00', end: '18:00' });
          makeFields();
        } else if (Number.isInteger(slotIndex)) state.days[dayIndex].slots[slotIndex][field] = target.value;
        saveState(); requestDraw(); updateSaveState();
      }
      fields.addEventListener('input', updateDay);
      fields.addEventListener('change', updateDay);
      fields.addEventListener('click', event => {
        const button = event.target.closest('button[data-action]');
        if (!button) return;
        const dayIndex = Number(button.dataset.dayIndex);
        if (!Number.isInteger(dayIndex)) return;
        const slots = state.days[dayIndex].slots;
        if (button.dataset.action === 'add-slot' && slots.length < MAX_SLOTS_PER_DAY) slots.push({ start: '09:00', end: '18:00' });
        if (button.dataset.action === 'remove-slot') {
          const slotIndex = Number(button.dataset.slotIndex);
          if (Number.isInteger(slotIndex) && slotIndex > 0) slots.splice(slotIndex, 1);
        }
        makeFields(); saveState(); requestDraw(); updateSaveState();
      });
      borderToggle.addEventListener('change', () => { state.showBorder = borderToggle.checked; saveState(); drawPreview(); });
      backgroundModeInput.addEventListener('change', () => { state.backgroundMode = backgroundModeInput.value; saveState(); requestDraw(); });
      slotLayoutModeInput.addEventListener('change', () => { state.slotLayoutMode = slotLayoutModeInput.value; saveState(); requestDraw(); });
      outputSizeInput.addEventListener('change', () => { state.outputSize = Number(outputSizeInput.value); updateOutputSizeLabel(); saveState(); });
      resetScheduleButton.addEventListener('click', () => {
        if (!window.confirm('月曜日から金曜日までの出勤予定を、すべて「空・9:00〜18:00」へ戻します。よろしいですか？')) return;
        state.days = createDefaultDays();
        makeFields(); saveState(); requestDraw(); updateSaveState();
      });
      async function readImageDimensions(file) {
        const bytes = new Uint8Array(await file.slice(0, 1024 * 1024).arrayBuffer());
        const read16 = offset => (bytes[offset] << 8) | bytes[offset + 1];
        const read24 = offset => (bytes[offset] << 16) | (bytes[offset + 1] << 8) | bytes[offset + 2];
        const read32 = offset => (bytes[offset] * 2 ** 24) + (bytes[offset + 1] << 16) + (bytes[offset + 2] << 8) + bytes[offset + 3];
        const ascii = (offset, text) => text.split('').every((char, index) => bytes[offset + index] === char.charCodeAt(0));
        if (ascii(1, 'PNG') && bytes.length >= 24) return { width: (bytes[16] * 2 ** 24) + read16(18), height: (bytes[20] * 2 ** 24) + read16(22) };
        if (ascii(0, 'RIFF') && ascii(8, 'WEBP')) {
          if (ascii(12, 'VP8X') && bytes.length >= 30) return { width: read24(24) + 1, height: read24(27) + 1 };
          if (ascii(12, 'VP8 ') && bytes.length >= 30) return { width: read16(26) & 0x3fff, height: read16(28) & 0x3fff };
          if (ascii(12, 'VP8L') && bytes.length >= 25 && bytes[20] === 0x2f) return { width: 1 + bytes[21] + ((bytes[22] & 0x3f) << 8), height: 1 + ((bytes[22] & 0xc0) >> 6) + (bytes[23] << 2) + ((bytes[24] & 0x0f) << 10) };
        }
        if ((file.type === 'image/heic' || file.type === 'image/heif') && bytes.length >= 20) {
          for (let offset = 0; offset + 16 < bytes.length; offset += 1) {
            if (ascii(offset, 'ispe')) return { width: read32(offset + 8), height: read32(offset + 12) };
          }
        }
        if (bytes[0] === 0xff && bytes[1] === 0xd8) {
          let offset = 2;
          while (offset + 8 < bytes.length) {
            if (bytes[offset] !== 0xff) { offset += 1; continue; }
            while (bytes[offset] === 0xff) offset += 1;
            const marker = bytes[offset++];
            const length = read16(offset);
            if (length < 2 || offset + length > bytes.length) break;
            if ((marker >= 0xc0 && marker <= 0xc3) || (marker >= 0xc5 && marker <= 0xc7) || (marker >= 0xc9 && marker <= 0xcb) || (marker >= 0xcd && marker <= 0xcf)) return { width: read16(offset + 5), height: read16(offset + 3) };
            offset += length;
          }
        }
        return null;
      }
      function clearBackground(message) {
        backgroundImage = null;
        backgroundInput.value = '';
        backgroundMessage.textContent = message;
        requestDraw();
      }
      backgroundInput.addEventListener('change', async () => {
        const file = backgroundInput.files && backgroundInput.files[0];
        if (!file) return;
        const loadVersion = ++backgroundLoadVersion;
        const allowedTypes = ['image/jpeg', 'image/png', 'image/webp', 'image/heic', 'image/heif'];
        const maximumFileSize = 30 * 1024 * 1024;
        if (!allowedTypes.includes(file.type) || file.size > maximumFileSize) {
          clearBackground('JPEG・PNG・WebP・HEIC形式で、30MB以下の画像を選んでください。');
          return;
        }
        const maximumPixels = 48000000;
        const dimensions = await readImageDimensions(file).catch(() => null);
        if (loadVersion !== backgroundLoadVersion) return;
        if (dimensions && (dimensions.width * dimensions.height > maximumPixels)) {
          clearBackground('画像の大きさは4,800万画素以下にしてください。');
          return;
        }
        const imageUrl = URL.createObjectURL(file);
        const image = new Image();
        image.onload = () => {
          URL.revokeObjectURL(imageUrl);
          if (loadVersion !== backgroundLoadVersion) return;
          if (image.naturalWidth * image.naturalHeight > maximumPixels) {
            clearBackground('画像の大きさは4,800万画素以下にしてください。');
            return;
          }
          backgroundImage = image;
          backgroundMessage.textContent = '';
          requestDraw();
        };
        image.onerror = () => { URL.revokeObjectURL(imageUrl); if (loadVersion === backgroundLoadVersion) clearBackground('画像を読み込めませんでした。別の画像を選んでください。'); };
        image.src = imageUrl;
      });
      saveButton.addEventListener('click', () => {
        if (hasIncompleteTime()) return;
        drawPreview();
        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = state.outputSize;
        exportCanvas.height = state.outputSize;
        exportCanvas.getContext('2d').drawImage(canvas, 0, 0, state.outputSize, state.outputSize);
        const filename = 'schedule_' + state.outputSize + '_' + new Date().toISOString().slice(0, 10) + '.png';
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const savePage = isIOS ? window.open('', '_blank') : null;
        if (isIOS && !savePage) {
          backgroundMessage.textContent = '画像保存用の画面を開けませんでした。ポップアップを許可して、もう一度お試しください。';
          return;
        }
        saveButton.disabled = true;
        exportCanvas.toBlob(blob => {
          if (!blob) { updateSaveState(); return; }
          const url = URL.createObjectURL(blob);
          if (savePage) {
            savePage.location.href = url;
            backgroundMessage.textContent = '開いた画像を長押し、または共有メニューから写真へ保存してください。';
            setTimeout(() => URL.revokeObjectURL(url), 60000);
            updateSaveState();
            return;
          }
          const link = document.createElement('a'); link.href = url; link.download = filename; link.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          updateSaveState();
        }, 'image/png');
      });
      borderToggle.checked = state.showBorder;
      backgroundModeInput.value = state.backgroundMode;
      slotLayoutModeInput.value = state.slotLayoutMode;
      outputSizeInput.value = String(state.outputSize);
      makeFields(); drawPreview(); updateSaveState(); updateOutputSizeLabel(); saveState();
    })();
  </script>
</body>
</html>
